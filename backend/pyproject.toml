[tool.poetry]
name = "mrt-weather-backend"
version = "0.1.0"
description = "Backend service aggregating MRT weather forecasts into daily summaries."
authors = ["Duddon & Furness MRT"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.24"}
httpx = "^0.24"
pydantic = "^2.5"

[tool.poetry.dev-dependencies]
pytest = "^7.5"
pytest-asyncio = "^0.21"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
